name: Bug report
description: Something on the website doesn't work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link
      description: The page or place where it happened, e.g. https://www.theworldsresources.org/#map/pipeline-tal
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Safari on iPhone 15, Firefox 140 on Windows
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Drag an image into this field.
