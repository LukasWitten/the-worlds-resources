name: CI

# Validates the datasets, builds the site and checks the result (SEO, Lighthouse).
# Deployment itself is done by Vercel (theworldsresources.org), not by this workflow.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate GeoJSON datasets
        run: npm run validate:data

      - name: Build site
        run: npm run build

      - name: SEO check (HTML without JavaScript, sitemap, JSON-LD, links)
        run: npm run check:seo

      - name: Lighthouse budget (accessibility, best practices, SEO)
        run: |
          npx astro preview --port 4321 &
          for i in $(seq 1 30); do curl -sf http://localhost:4321/ > /dev/null && break; sleep 1; done
          npm run check:lighthouse
